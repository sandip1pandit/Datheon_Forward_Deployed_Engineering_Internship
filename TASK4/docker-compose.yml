
services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-ai-service

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      MODEL_NAME: ${MODEL_NAME:-openai/gpt-oss-120b}

    restart: unless-stopped

    depends_on:
      erp-service:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - monitoring

  erp-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-erp-service

    command:
      - uvicorn
      - src.api.erp_main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"

    ports:
      - "8001:8001"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest

    container_name: enterprise-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    restart: unless-stopped

    depends_on:
      ai-service:
        condition: service_healthy

    networks:
      - monitoring

volumes:
  prometheus_data:

networks:
  monitoring:
    driver: bridge